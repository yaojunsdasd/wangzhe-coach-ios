name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 选择 Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.2.app || sudo xcode-select -s /Applications/Xcode.app

      - name: 安装 XcodeGen
        run: brew install xcodegen || brew upgrade xcodegen

      - name: 定位工程目录
        id: locate
        run: |
          if [ -f "WangzheCoach/project.yml" ]; then
            echo "dir=WangzheCoach" >> $GITHUB_OUTPUT
          elif [ -f "ios/WangzheCoach/project.yml" ]; then
            echo "dir=ios/WangzheCoach" >> $GITHUB_OUTPUT
          else
            find . -name project.yml; exit 1
          fi

      - name: 生成 Xcode 工程
        working-directory: ${{ steps.locate.outputs.dir }}
        run: xcodegen generate

      - name: 编译
        id: build
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          set +e
          xcodebuild \
            -project WangzheCoach.xcodeproj \
            -scheme WangzheCoach \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1
          CODE=$?
          set -e
          echo "exit=$CODE" >> $GITHUB_OUTPUT
          {
            echo "## 编译结果: exit=$CODE"
            echo ""
            echo "### error 行"
            echo '\`\`\`'
            grep -E "error:" build.log | head -100 || echo "(none)"
            echo '\`\`\`'
          } >> $GITHUB_STEP_SUMMARY
          exit $CODE

      # 关键：把日志提交回仓库，方便外部读取
      - name: 提交日志到仓库
        if: always()
        run: |
          mkdir -p logs
          cp ${{ steps.locate.outputs.dir }}/build.log logs/build.log || true
          grep -E "error:" logs/build.log | head -100 > logs/errors.txt || echo "(none)" > logs/errors.txt
          git config user.name "ci-bot"
          git config user.email "ci@local"
          git add logs/ || true
          git commit -m "ci: build log $(date +%s)" || true
          git push || true

      - name: 上传完整日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ steps.locate.outputs.dir }}/build.log

      - name: 打包 IPA
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "app: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r WangzheCoach-unsigned.ipa Payload
          ls -lh WangzheCoach-unsigned.ipa

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: WangzheCoach-ipa
          path: ${{ steps.locate.outputs.dir }}/WangzheCoach-unsigned.ipa
