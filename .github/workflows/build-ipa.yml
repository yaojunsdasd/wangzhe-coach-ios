name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: 选择 Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.2.app

      - name: 安装 XcodeGen
        run: brew install xcodegen || brew upgrade xcodegen

      - name: 定位工程目录
        id: locate
        run: |
          if [ -f "WangzheCoach/project.yml" ]; then
            echo "dir=WangzheCoach" >> $GITHUB_OUTPUT
          elif [ -f "ios/WangzheCoach/project.yml" ]; then
            echo "dir=ios/WangzheCoach" >> $GITHUB_OUTPUT
          else find . -name project.yml; exit 1; fi

      - name: 生成工程
        working-directory: ${{ steps.locate.outputs.dir }}
        run: xcodegen generate

      - name: 编译
        id: build
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          set +e
          xcodebuild \
            -project WangzheCoach.xcodeproj \
            -scheme WangzheCoach \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            build > build.log 2>&1
          CODE=$?
          set -e
          echo "exit=$CODE" >> $GITHUB_OUTPUT
          {
            echo "## 编译结果 exit=$CODE"
            echo '\`\`\`'
            grep -E "error:" build.log | head -60 || echo "(no error)"
            echo '\`\`\`'
          } >> $GITHUB_STEP_SUMMARY
          exit $CODE

      - name: 打包并验证
        id: pack
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          set +e
          exec > >(tee pack.log) 2>&1

          P=build/Build/Products/Release-iphoneos
          APP="$P/WangzheCoach.app"
          APX="$APP/PlugIns/BroadcastExtension.appex"
          EXT="$P/BroadcastExtension.appex"

          echo "=========== 打包与验证 ==========="
          echo "APP=$APP"
          echo "EXT=$EXT"
          echo ""

          if [ ! -d "$APP" ]; then
            echo "错误: 主 App 不存在"
            ls -la "$P" 2>&1 | head -30
            echo "PACK_FAILED" >> $GITHUB_OUTPUT
            exit 0
          fi
          if [ ! -d "$EXT" ]; then
            echo "错误: 扩展 appex 不存在"
            ls -la "$P" 2>&1 | head -30
            echo "PACK_FAILED" >> $GITHUB_OUTPUT
            exit 0
          fi

          rm -rf "$APP/PlugIns"
          mkdir -p "$APP/PlugIns"
          cp -R "$EXT" "$APP/PlugIns/"

          mkdir -p Payload
          rm -rf Payload/*
          cp -R "$APP" Payload/
          rm -f WangzheCoach-unsigned.ipa
          zip -qr WangzheCoach-unsigned.ipa Payload

          echo ""
          echo "--- 二进制 ---"
          echo "主程序: $(stat -f%z "$APP/WangzheCoach" 2>/dev/null) bytes"
          echo "扩展:   $(stat -f%z "$APX/BroadcastExtension" 2>/dev/null) bytes"
          lipo -info "$APP/WangzheCoach" 2>&1
          lipo -info "$APX/BroadcastExtension" 2>&1

          echo ""
          echo "--- .app 全部文件 ---"
          (cd "$APP" && find . -type f | sort)

          echo ""
          echo "--- 扩展 Info.plist ---"
          plutil -p "$APX/Info.plist" 2>&1

          echo ""
          echo "--- 扩展关键字段 ---"
          echo "CFBundlePackageType: $(plutil -extract CFBundlePackageType raw "$APX/Info.plist" 2>&1)"
          echo "CFBundleIdentifier:  $(plutil -extract CFBundleIdentifier raw "$APX/Info.plist" 2>&1)"
          echo "CFBundleExecutable:  $(plutil -extract CFBundleExecutable raw "$APX/Info.plist" 2>&1)"
          echo "NSExtPointId:        $(plutil -extract NSExtension.NSExtensionPointIdentifier raw "$APX/Info.plist" 2>&1)"
          echo "NSExtPrincipalClass: $(plutil -extract NSExtension.NSExtensionPrincipalClass raw "$APX/Info.plist" 2>&1)"
          echo "RPBroadcastMode:     $(plutil -extract NSExtension.RPBroadcastProcessMode raw "$APX/Info.plist" 2>&1)"

          echo ""
          echo "--- IPA ---"
          ls -lh WangzheCoach-unsigned.ipa

          # 把验证内容存到仓库根的 logs/（绝对路径，避免工作目录问题）
          ROOT=$(git rev-parse --show-toplevel)
          mkdir -p "$ROOT/logs"
          cp pack.log "$ROOT/logs/pack.log" 2>/dev/null
          echo "PACK_OK" >> $GITHUB_OUTPUT
          exit 0

      - name: 上传日志与验证
        if: always()
        run: |
          ROOT=$(git rev-parse --show-toplevel)
          mkdir -p "$ROOT/logs"
          cp ${{ steps.locate.outputs.dir }}/build.log "$ROOT/logs/build.log" 2>/dev/null || true
          cp ${{ steps.locate.outputs.dir }}/pack.log "$ROOT/logs/pack.log" 2>/dev/null || true
          grep -E "error:" "$ROOT/logs/build.log" 2>/dev/null | head -60 > "$ROOT/logs/errors.txt" || echo "(none)" > "$ROOT/logs/errors.txt"
          git config user.name ci-bot
          git config user.email ci@local
          git add logs/ 2>/dev/null || true
          git commit -m "ci: logs" 2>/dev/null || true
          git push 2>/dev/null || true

          if [ "${{ steps.pack.outputs.PACK_FAILED }}" = "PACK_FAILED" ]; then
            echo "打包失败"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: steps.pack.outputs.PACK_OK == 'PACK_OK'
        with:
          name: WangzheCoach-ipa
          path: ${{ steps.locate.outputs.dir }}/WangzheCoach-unsigned.ipa
