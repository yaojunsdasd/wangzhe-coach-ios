name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: 选择 Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.2.app

      - name: 安装 XcodeGen
        run: brew install xcodegen || brew upgrade xcodegen

      - name: 定位工程目录
        id: locate
        run: |
          if [ -f "WangzheCoach/project.yml" ]; then
            echo "dir=WangzheCoach" >> $GITHUB_OUTPUT
          elif [ -f "ios/WangzheCoach/project.yml" ]; then
            echo "dir=ios/WangzheCoach" >> $GITHUB_OUTPUT
          else find . -name project.yml; exit 1; fi

      - name: 生成工程
        working-directory: ${{ steps.locate.outputs.dir }}
        run: xcodegen generate

      - name: 编译
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          xcodebuild \
            -project WangzheCoach.xcodeproj \
            -scheme WangzheCoach \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            build > build.log 2>&1

      - name: 打包 IPA
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          P=build/Build/Products/Release-iphoneos
          APP="$P/WangzheCoach.app"
          EXT="$P/BroadcastExtension.appex"

          rm -rf "$APP/PlugIns"
          mkdir -p "$APP/PlugIns"
          cp -R "$EXT" "$APP/PlugIns/"

          mkdir -p Payload
          rm -rf Payload/*
          cp -R "$APP" Payload/
          rm -f WangzheCoach-unsigned.ipa
          zip -qr WangzheCoach-unsigned.ipa Payload

          ls -lh WangzheCoach-unsigned.ipa

      - name: 产物验证
        if: always()
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          ROOT=$(git rev-parse --show-toplevel)
          mkdir -p "$ROOT/logs"

          P=build/Build/Products/Release-iphoneos
          APP="$P/WangzheCoach.app"
          APX="$APP/PlugIns/BroadcastExtension.appex"

          {
            echo "########## BUILD ##########"
            if [ -f build.log ]; then
              grep -E "error:" build.log | head -40 || true
              tail -3 build.log
            fi
            echo ""
            echo "########## PACK ##########"
            echo "-- 二进制 --"
            echo "主程序: $(stat -f%z "$APP/WangzheCoach" 2>/dev/null || echo missing) bytes"
            echo "扩展:   $(stat -f%z "$APX/BroadcastExtension" 2>/dev/null || echo missing) bytes"
            lipo -info "$APP/WangzheCoach" 2>&1 || true
            lipo -info "$APX/BroadcastExtension" 2>&1 || true
            echo ""
            echo "-- .app 全部文件 --"
            (cd "$APP" && find . -type f 2>/dev/null | sort)
            echo ""
            echo "-- 扩展 plist 关键字段 --"
            for k in CFBundlePackageType CFBundleIdentifier CFBundleExecutable; do
              printf '%s = %s\n' "$k" "$(plutil -extract $k raw "$APX/Info.plist" 2>&1)"
            done
            printf 'NSExtPointId = %s\n' "$(plutil -extract NSExtension.NSExtensionPointIdentifier raw "$APX/Info.plist" 2>&1)"
            printf 'NSExtPrincipalClass = %s\n' "$(plutil -extract NSExtension.NSExtensionPrincipalClass raw "$APX/Info.plist" 2>&1)"
            printf 'RPBroadcastMode = %s\n' "$(plutil -extract NSExtension.RPBroadcastProcessMode raw "$APX/Info.plist" 2>&1)"
            echo ""
            echo "-- IPA --"
            ls -lh WangzheCoach-unsigned.ipa 2>&1 || echo "IPA 不存在"
          } > "$ROOT/logs/verify.txt" 2>&1

          cat "$ROOT/logs/verify.txt"

          cp build.log "$ROOT/logs/build.log" 2>/dev/null || true
          grep -E "error:" "$ROOT/logs/build.log" 2>/dev/null | head -40 > "$ROOT/logs/errors.txt" || echo "(none)" > "$ROOT/logs/errors.txt"

          git config user.name ci-bot
          git config user.email ci@local
          git add logs/ 2>/dev/null || true
          git commit -m "ci: logs" 2>/dev/null || true
          git push 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WangzheCoach-ipa
          path: ${{ steps.locate.outputs.dir }}/WangzheCoach-unsigned.ipa
          if-no-files-found: warn
