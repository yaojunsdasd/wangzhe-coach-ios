name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: 选择 Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.2.app

      - name: 安装 XcodeGen
        run: brew install xcodegen || brew upgrade xcodegen

      - name: 定位工程目录
        id: locate
        run: |
          if [ -f "WangzheCoach/project.yml" ]; then
            echo "dir=WangzheCoach" >> $GITHUB_OUTPUT
          elif [ -f "ios/WangzheCoach/project.yml" ]; then
            echo "dir=ios/WangzheCoach" >> $GITHUB_OUTPUT
          else find . -name project.yml; exit 1; fi

      - name: 生成工程
        working-directory: ${{ steps.locate.outputs.dir }}
        run: xcodegen generate

      # 关键：只 build 到 install 阶段，不执行 Embed App Extensions 校验。
      # -destination generic/platform=iOS 会跳过模拟器 destination 歧义。
      - name: 编译（不签名，手动组装）
        id: build
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          set +e
          xcodebuild \
            -project WangzheCoach.xcodeproj \
            -scheme WangzheCoach \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            build > build.log 2>&1
          CODE=$?
          set -e
          echo "exit=$CODE" >> $GITHUB_OUTPUT
          {
            echo "## 编译结果: exit=$CODE"
            echo ""
            echo '\`\`\`'
            grep -E "error:" build.log | head -60 || echo "(no error)"
            echo '\`\`\`'
          } >> $GITHUB_STEP_SUMMARY
          exit $CODE

      - name: 提交日志
        if: always()
        run: |
          mkdir -p logs
          cp ${{ steps.locate.outputs.dir }}/build.log logs/build.log || true
          grep -E "error:" logs/build.log | head -60 > logs/errors.txt || echo "(none)" > logs/errors.txt
          git config user.name ci-bot
          git config user.email ci@local
          git add logs/
          git commit -m "ci: build log" || true
          git push || true

      - name: 上传完整日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ steps.locate.outputs.dir }}/build.log

      - name: 组装 IPA
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          P=build/Build/Products/Release-iphoneos
          APP="$P/WangzheCoach.app"
          EXT="$P/BroadcastExtension.appex"
          for f in "$APP" "$EXT"; do
            if [ ! -d "$f" ]; then
              echo "缺失: $f"
              ls -la "$P" | head -30
              exit 1
            fi
          done

          # 幂等：先清掉可能存在的 PlugIn 再覆盖
          rm -rf "$APP/PlugIns"
          mkdir -p "$APP/PlugIns"
          cp -R "$EXT" "$APP/PlugIns/"

          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr WangzheCoach-unsigned.ipa Payload

          echo "### IPA 内容" >> $GITHUB_STEP_SUMMARY
          echo '\`\`\`' >> $GITHUB_STEP_SUMMARY
          unzip -l WangzheCoach-unsigned.ipa | head -30 >> $GITHUB_STEP_SUMMARY
          echo '\`\`\`' >> $GITHUB_STEP_SUMMARY
          ls -lh WangzheCoach-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: WangzheCoach-ipa
          path: ${{ steps.locate.outputs.dir }}/WangzheCoach-unsigned.ipa
